# Netlify build settings for the Next.js 16 site.
# Netlify detects Next.js and adds its OpenNext adapter automatically
# (SSR, Partial Prerendering, Cache Components, next/image via Image CDN).
# Netlify recommends NOT pinning @netlify/plugin-nextjs, so it is not listed.

[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Next.js 16 needs Node 20.9 or newer; this matches local development.
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# A week's cache for the place photos in /photos. (Bike photos share the /bikes/ path with
# the bike pages, so they keep Netlify's default revalidating cache.)
[[headers]]
  for = "/photos/*"
  [headers.values]
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
